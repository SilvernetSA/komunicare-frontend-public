<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'
        'unsafe-inline'
        'unsafe-eval'
        https://*
        http://localhost:3000/
        https://api.komuni.care/
        http://localhost:10010/
        http://www.googletagmanager.com/gtag/js
        ws://localhost:3000/
        wss://localhost:3000/
        ws://192.168.0.109:3000/
        wss://192.168.0.109:3000/
        wss://*.microsoft.com/
        blob:
        gap:
        data:;
    connect-src 'self'
        https://*
        http://localhost:3000/
        https://api.komuni.care/
        http://localhost:10010/
        ws://localhost:3000/
        wss://localhost:3000/
        ws://192.168.0.109:3000/
        wss://192.168.0.109:3000/
        wss://*.microsoft.com/
        https://*.microsoft.com/
        blob:
        data:;
    img-src * data:  filesystem:  blob:  ;
    ">

  <meta property="og:title" content="Komunicare - AAC Communication Board" />
  <meta property="og:description" content="Komunicare is an augmentative and alternative communication (AAC) application, allowing users with speech and language impairments (Autism, Cerebral Palsy) to communicate with symbols and text-to-speech." />
  <meta property="og:image" content="%PUBLIC_URL%/logo_150_150.png" />

  <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
  <link rel="shortcut icon" href="%PUBLIC_URL%/logo.svg">
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `yarn build`.
    -->

  <!-- Add to homescreen for Chrome on Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Komunicare">
  <link rel="icon" sizes="192x192" href="%PUBLIC_URL%/images/touch/chrome-touch-icon-192x192.png">

  <!-- Add to homescreen for Safari on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Komunicare">
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/touch/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/images/touch/touch-icon-iphone-retina.png">
  <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/images/touch/touch-icon-ipad-retina.png">

  <!-- Color the status bar on mobile devices -->
  <meta name="theme-color" content="#000000">



  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'UA-108091601-1');
  </script>

  <title>Komunicare - AAC Communication Board</title>
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>
  <div id="root"></div>
</body>

</html>
